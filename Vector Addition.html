<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Vector Addition</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .widget-card {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:active {
      transform: scale(0.97);
    }
    button.secondary {
      background-color: #64748b;
    }
    button.secondary:hover {
      background-color: #475569;
    }
    #container {
      width: 100%;
      height: 380px;
      background-color: #fafafa;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
    }
    @media (max-width: 480px) {
      button {
        flex: 1 1 calc(50% - 8px);
        padding: 12px 8px;
      }
      #container {
        height: 300px;
      }
    }
  </style>
</head>
<body>

<div class="widget-card">
  <div class="controls">
    <button id="step1">Step 1: First Vector</button>
    <button id="step2">Step 2: Add Second Vector</button>
    <button id="step3">Step 3: Show Sum</button>
    <button id="reset" class="secondary">Reset</button>
    <button id="newExample" class="secondary">New Example</button>
  </div>
  <div id="container"></div>
</div>

<script src="dynamicexample.js"></script>
</body>
</html>
